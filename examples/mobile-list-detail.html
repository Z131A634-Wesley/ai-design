<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>邻里借用 — 社区工具库</title>
<style>
:root{color-scheme:light;--wash:#e9ebe3;--paper:#fcfcf7;--ink:#242e22;--quiet:#50594d;--rule:#d5d9ce;--strong:#75806f;--forest:#263c31;--leaf:#e0edac;--sage:#e8eddb;--clay:#f3e5d9;--blue:#e0e9ed;font:100%/1.5 system-ui,'Microsoft YaHei',sans-serif;background:var(--wash);color:var(--ink)}
*{box-sizing:border-box}body{margin:0}h1,h2,p{margin:0}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--forest);outline-offset:3px}[hidden]{display:none!important}.symbol-sheet{position:absolute;width:0;height:0;overflow:hidden}.phone{max-width:32rem;min-height:100svh;margin:auto;padding:1rem clamp(.95rem,4vw,1.5rem) calc(1.2rem + env(safe-area-inset-bottom,0px));background:var(--paper);box-shadow:0 0 0 1px var(--rule)}.mast{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.2rem 0 .9rem}.brand{display:flex;gap:.48rem;align-items:center;font-size:.96rem;font-weight:800}.brand-icon{width:1.85rem;height:1.85rem;display:grid;place-items:center;color:var(--leaf);background:var(--forest);border-radius:.45rem}.mast .mark{font-size:.74rem;color:var(--quiet)}
.banner{background:var(--forest);color:var(--paper);padding:clamp(1rem,5vw,1.45rem);border-radius:1.15rem;position:relative;overflow:hidden;isolation:isolate}.banner svg{position:absolute;width:min(45%,10rem);height:auto;right:-.4rem;bottom:-1.7rem;opacity:.5;z-index:-1}.banner p{font-size:.83rem;color:var(--leaf);font-weight:650}.banner h1{font-size:clamp(1.5rem,6vw,2.25rem);line-height:1.16;margin:.45rem 0;letter-spacing:-.025em}.banner .sub{color:var(--paper);font-weight:400;max-width:18em}.search{display:block;margin-top:1.15rem;font-size:.81rem;color:var(--quiet);font-weight:700}.search-box{display:flex;position:relative;margin-top:.28rem}.search-box svg{position:absolute;left:.7rem;top:.8rem;width:1.12rem;height:1.12rem;pointer-events:none}.search-box input{width:100%;min-height:46px;min-width:0;border:1px solid var(--strong);border-radius:.7rem;background:var(--paper);padding:.55rem .7rem .55rem 2.3rem}.list-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.25rem .7rem;margin:1.1rem 0 .35rem}.list-head h2{font-size:1rem}.summary{font-size:.76rem;color:var(--quiet)}
.tool-list{list-style:none;padding:0;margin:0}.tool-list li{border-bottom:1px solid var(--rule)}.tool-list button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.65rem;align-items:center;width:100%;border:0;background:none;text-align:left;padding:.58rem .15rem;color:var(--ink);border-radius:.45rem}.tool-list button:hover{background:var(--sage)}.thumb{display:grid;place-items:center;width:clamp(2.6rem,14vw,3.4rem);aspect-ratio:1;background:var(--sage);border-radius:.65rem}.thumb svg{width:85%;height:85%}.thumb.clay,.art.clay{background:var(--clay)}.thumb.blue,.art.blue{background:var(--blue)}.tool-name,.tool-info{display:block}.tool-name{font-weight:780;font-size:.96rem}.tool-info{font-size:.78rem;color:var(--quiet);overflow-wrap:anywhere}.badge{font-weight:730;font-size:.71rem;white-space:nowrap;border-radius:.3rem;padding:.15rem .34rem;color:var(--forest);background:var(--sage)}.badge.out{color:#743f34;background:var(--clay)}.strip{display:flex;gap:.55rem;align-items:baseline;flex-wrap:wrap}.action,.back{min-height:46px;border:0;border-radius:.6rem;padding:.55rem .85rem;font-weight:730}.action{background:var(--forest);color:var(--paper)}.action:hover{background:#354e40}.back{margin:0 0 .55rem;padding-inline:0;background:none;color:var(--forest)}.art{background:var(--sage);border-radius:1.15rem;min-height:9rem;display:grid;place-items:center}.art svg{width:min(46%,9rem);height:auto}.detail-title{font-size:clamp(1.5rem,6vw,2rem);line-height:1.18;margin:.85rem 0 .25rem}.detail-copy{margin:.8rem 0 1rem;color:var(--quiet)}.note{font-size:.78rem;color:var(--quiet);margin-top:1.05rem;padding-top:.7rem;border-top:1px solid var(--rule)}.empty{padding:1.2rem 0}.empty strong{display:block}.empty p{margin:.25rem 0 .75rem;color:var(--quiet)}.done{padding:1.45rem;background:var(--sage);border-radius:1.15rem}.done p{margin:.55rem 0 .9rem;color:var(--quiet)}.done h1{font-size:1.75rem;line-height:1.15}
.loan-terms{display:grid;grid-template-columns:1fr 1fr;gap:.45rem 1rem;margin:0 0 1.15rem;padding:.7rem 0;border-block:1px solid var(--rule)}.loan-terms dt{color:var(--quiet);font-size:.78rem}.loan-terms dd{margin:.22rem 0 0;font-size:.92rem;font-weight:700}#next{width:100%}
@media(max-width:22rem){.tool-list button{gap:.38rem}.badge{font-size:.67rem}.banner svg{opacity:.25}}
</style>
</head>
<body>
<svg class="symbol-sheet" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
 <symbol id="tool-drill" viewBox="0 0 64 64"><path d="M12 20h31l7 5v14H30l-1 14H17l2-15h-7z" fill="#557052"/><path d="M48 26h9v9h-9zM56 29h7v3h-7z" fill="#263c31"/><path d="M13 51h19v6H13z" fill="#263c31"/><path d="M18 26h19m-19 5h12" stroke="#d8e7b3" stroke-width="2" stroke-linecap="round"/></symbol>
 <symbol id="tool-ladder" viewBox="0 0 64 64"><path d="M18 56 28 10h9l12 46m-25-1 9-45M26 22h15M23 31h20M21 40h24M19 49h28" fill="none" stroke="#864d3b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 10h13" stroke="#452d25" stroke-width="4" stroke-linecap="round"/></symbol>
 <symbol id="tool-tape" viewBox="0 0 64 64"><rect x="11" y="18" width="36" height="30" rx="10" fill="#4c6d7c"/><circle cx="28" cy="33" r="9" fill="#d9e5e9"/><path d="M45 35h13v7H45z" fill="#e4ad53"/><path d="M51 35v3m4-3v3" stroke="#684520"/></symbol>
</svg>
<main class="phone">
 <header class="mast"><span class="brand"><span class="brand-icon" aria-hidden="true">邻</span>邻里借用</span><span class="mark">社区工具库 · 原型</span></header>
 <section id="listing" aria-labelledby="list-title">
  <div class="banner"><p>社区共享</p><h1 id="list-title" tabindex="-1">附近的工具</h1><p class="sub">为周末的修理和改造借件工具。</p><svg viewBox="0 0 160 140" aria-hidden="true"><path d="M20 50 80 14l60 36v64l-60 17-60-17zM20 50l60 24 60-24M80 74v57M48 67v31m64-31v31" fill="none" stroke="#e0edac" stroke-width="2" stroke-linejoin="round"/></svg></div>
  <label class="search" for="query">搜索工具</label><div class="search-box"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2"/></svg><input id="query" type="search" placeholder="例如：电钻" autocomplete="off"></div>
  <div class="list-head"><h2>工具目录</h2><p class="summary" id="count" role="status"></p></div>
  <ul class="tool-list" id="results">
   <li data-key="钻 电钻 安装"><button type="button" data-id="drill"><span class="thumb"><svg aria-hidden="true" viewBox="0 0 64 64"><use href="#tool-drill"/></svg></span><span><span class="tool-name">无线电钻</span><span class="tool-info">安装木质家具配件</span></span><span class="badge">可借</span></button></li>
   <li data-key="梯 折叠梯"><button type="button" data-id="ladder"><span class="thumb clay"><svg aria-hidden="true" viewBox="0 0 64 64"><use href="#tool-ladder"/></svg></span><span><span class="tool-name">折叠梯</span><span class="tool-info">适合室内登高</span></span><span class="badge out">已借出</span></button></li>
   <li data-key="测量 卷尺"><button type="button" data-id="tape"><span class="thumb blue"><svg aria-hidden="true" viewBox="0 0 64 64"><use href="#tool-tape"/></svg></span><span><span class="tool-name">五米卷尺</span><span class="tool-info">测量家具和房间</span></span><span class="badge">可借</span></button></li>
  </ul>
  <div class="empty" id="empty" hidden><strong>没有匹配的工具</strong><p>换个短一点的词，或查看全部工具。</p><button id="clear" class="action" type="button">清空搜索</button></div>
 </section>
 <section id="detail" hidden aria-labelledby="detail-title">
  <button id="back" class="back" type="button">← 返回工具列表</button>
  <div class="art" aria-hidden="true"><svg viewBox="0 0 64 64"><use id="detail-icon" href="#tool-drill"/></svg></div>
  <h1 id="detail-title" class="detail-title" tabindex="-1"></h1><p class="strip"><span id="status" class="badge"></span><span class="summary">社区共享工具</span></p>
  <p class="detail-copy" id="detail-info"></p>
  <dl class="loan-terms"><div><dt>领取点</dt><dd>社区服务台</dd></div><div><dt>借用时长</dt><dd>最多 2 天</dd></div></dl>
  <button id="next" class="action" type="button"></button><p class="note">虚构数据。演示不会发出真实预约。</p>
 </section>
 <section id="done" class="done" hidden aria-labelledby="done-title"><h1 id="done-title" tabindex="-1">模拟预约完成</h1><p>原型没有发出实际预约，也没有通知出借人。</p><button id="done-back" class="action" type="button">返回工具列表</button></section>
</main>
<script>
const $ = id => document.getElementById(id);
const query = $('query'), rows = [...$('results').children];
const details = {drill:['无线电钻','可借','适合安装木质家具上的配件。请先确认钻头尺寸。'],ladder:['折叠梯','已借出','折叠梯暂时无法预约，可以返回查看其他可借工具。'],tape:['五米卷尺','可借','适合测量家具和房间尺寸。']};
let current, trigger, scrollBefore = 0;
function filter(){const q=query.value.trim(); let count=0; for(const row of rows){row.hidden=!row.dataset.key.includes(q);if(!row.hidden)count++;} $('count').textContent=`${count} 项工具`; $('empty').hidden=count!==0;}
function show(id){for(const screen of ['listing','detail','done']) $(screen).hidden=screen!==id; $(id).querySelector('h1').focus({preventScroll:true});}
function returnToList(){show('listing');if(trigger&&!trigger.closest('li').hidden)trigger.focus({preventScroll:true});else query.focus({preventScroll:true});window.scrollTo(0,scrollBefore);}
query.addEventListener('input',filter); $('clear').onclick=()=>{query.value='';filter();query.focus();};
for(const row of rows){row.querySelector('button').onclick=event=>{
 trigger=event.currentTarget;scrollBefore=window.scrollY;const id=trigger.dataset.id;current=details[id];
 $('detail-title').textContent=current[0];$('status').textContent=current[1];$('detail-info').textContent=current[2];
 $('detail-icon').setAttribute('href',`#tool-${id}`);$('status').setAttribute('class',current[1]==='可借'?'badge':'badge out');
 $('next').textContent=current[1]==='可借'?'模拟预约':'查看其他工具';show('detail');window.scrollTo(0,0);
};}
$('back').onclick=returnToList;$('done-back').onclick=returnToList;
$('next').onclick=()=>{if(current[1]!=='可借'){returnToList();return;}show('done');window.scrollTo(0,0);};filter();
</script>
</body>
</html>
