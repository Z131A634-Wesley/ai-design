<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>行简 — 账户流程演示</title>
<style>
:root{color-scheme:light;--sheet:#f8f7fb;--paper:#fff;--ink:#211b2e;--muted:#585367;--line:#867e95;--soft:#dfdae7;--primary:#6139b0;--deep:#211437;--lavender:#d5c2ff;--cream:#ffd7c8;--error:#982446;font:100%/1.5 system-ui,'Microsoft YaHei',sans-serif;color:var(--ink);background:var(--sheet)}
*{box-sizing:border-box}body{margin:0}.page{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr)}.brand{display:flex;align-items:center;gap:.65rem;letter-spacing:.08em;font-weight:750}.brandmark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.56rem;background:var(--lavender);color:var(--deep);font-weight:900}.feature{background:var(--deep);color:var(--sheet);padding:clamp(1.5rem,4.1vw,4.3rem);display:flex;flex-direction:column;justify-content:space-between;gap:2rem;min-width:0}.feature .headline{margin:0;font-size:clamp(2.15rem,4vw,4.6rem);font-weight:750;line-height:1.15;letter-spacing:-.045em}.feature p{margin:.85rem 0 0;color:var(--lavender);max-width:24em}.flow{width:100%;max-width:38rem;display:block;margin-inline:auto}.feature footer{display:flex;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap;border-top:1px solid #71618b;padding-top:.9rem;color:var(--lavender);font-size:.78rem}
.shell{padding:clamp(1.2rem,5vw,5.5rem);display:grid;align-items:center}.form-area{width:min(100%,25.5rem);margin-inline:auto}.small-brand{display:none}.intro{display:inline-block;color:var(--primary);background:#eee7fb;padding:.22rem .62rem;border-radius:.35rem;font-size:.79rem;font-weight:720;margin:0 0 .9rem}.intro,h1,.hint{overflow-wrap:anywhere}h1{font-size:clamp(1.75rem,3.3vw,2.65rem);line-height:1.15;margin:0 0 .5rem;letter-spacing:-.035em}.hint{margin:0;color:var(--muted)}form{margin-top:1.5rem}.field-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.2rem 1rem;margin-bottom:.3rem}label{font-weight:700;font-size:.92rem}.field-head:not(:first-child){margin-top:.9rem}input,button{font:inherit;color:inherit}input{display:block;width:100%;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:.6rem;padding:.6rem .75rem;background:var(--paper)}.field{display:flex;position:relative;align-items:stretch}.field input{padding-inline-end:6.5rem}.toggle{position:absolute;inset-block:0;inset-inline-end:0;border:0;background:none;color:var(--muted);padding:0 .7rem;font-size:.83rem}.primary,.plain,.demo button{cursor:pointer}.primary{min-height:48px;border:0;border-radius:.63rem;width:100%;margin:1.1rem 0 .35rem;padding:.65rem .95rem;background:var(--primary);color:var(--paper);font-weight:750}.primary:hover{background:#4d288f}.plain{min-height:44px;border:0;background:none;color:var(--primary);padding:.2rem 0;text-decoration:underline;text-underline-offset:.19em;font-size:.88rem}.field-head .plain{margin-block:-.55rem}.err{color:var(--error);margin:.28rem 0;font-size:.87rem}.err:empty,#recovery-status:empty{display:none}.alert:not(:empty){padding:.6rem .75rem;border-inline-start:3px solid var(--error);background:#faeaf0;margin-top:.75rem}[aria-invalid=true]{border-color:var(--error);box-shadow:inset 0 0 0 1px var(--error)}
.demo{margin-top:1.7rem;padding-top:1rem;border-top:1px solid var(--soft);color:var(--muted);font-size:.83rem}.demo summary{font-weight:700;color:var(--ink);cursor:pointer;min-height:44px;align-content:center}.demo p{margin:.22rem 0 .55rem}.demo button{min-height:44px;border:1px solid var(--line);border-radius:.45rem;background:var(--paper);padding:.28rem .55rem;margin:0 .3rem .35rem;font-size:.82rem}.local{margin-top:.9rem;color:var(--muted);font-size:.78rem}.outcome{border-left:3px solid var(--primary);padding:.5rem .75rem;color:var(--muted)}:focus-visible{outline:2px solid var(--primary);outline-offset:3px}[hidden]{display:none!important}
@media(max-width:52rem){.page{display:block}.feature{display:none}.shell{min-height:100svh;align-items:start}.small-brand{display:flex;margin-bottom:2rem}.form-area{width:min(100%,26rem)}}@media(max-width:24rem){.shell{padding:1rem}.small-brand{margin-bottom:1.35rem}}
</style>
</head>
<body>
<div class="page">
 <aside class="feature" aria-label="行简工作台介绍">
  <div class="brand"><span class="brandmark" aria-hidden="true">行</span>行简工作台</div>
  <div><p class="headline">团队待办，一处跟进。</p><p>查看任务负责人、当前进度和关联资料。</p></div>
  <svg class="flow" aria-hidden="true" viewBox="0 0 540 228" xmlns="http://www.w3.org/2000/svg">
   <path d="M0 38h540M0 92h540M0 146h540M0 200h540M54 0v228M108 0v228M162 0v228M216 0v228M270 0v228M324 0v228M378 0v228M432 0v228M486 0v228" stroke="#584768" opacity=".58"/>
   <path d="M52 159h91q52 0 52-42t54-42h32m-14 0h78q48 0 48 45t55 45h42M252 75v115h69" fill="none" stroke="#b697f6" stroke-width="2"/>
   <path d="M52 159h87q56 0 56-42t54-42h32" fill="none" stroke="#ffd7c8" stroke-width="2"/>
   <circle cx="53" cy="159" r="8" fill="#ffd7c8"/><circle cx="251" cy="75" r="29" fill="#bda1ff"/>
   <path d="m238 75 9 9 17-19" fill="none" stroke="#211437" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="488" cy="165" r="9" fill="#bda1ff"/><circle cx="321" cy="190" r="6" fill="#ffd7c8"/>
  </svg>
  <footer><span>团队任务与资料</span><span>账户流程演示</span></footer>
 </aside>
 <main class="shell">
  <div class="form-area">
   <div class="small-brand brand"><span class="brandmark" aria-hidden="true">行</span>行简工作台</div>
   <p class="intro">本地演示</p>
   <section id="login" aria-labelledby="login-title">
    <h1 id="login-title" tabindex="-1">登录工作台</h1>
    <p class="hint">登录后可查看待办和任务资料。</p>
    <form id="signin" novalidate>
     <div class="field-head"><label for="user">工作邮箱</label></div>
     <input id="user" name="username" type="email" autocomplete="username" placeholder="demo@example.test" required aria-describedby="user-error">
     <p class="err" id="user-error"></p>
     <div class="field-head"><label for="secret">密码</label><button class="plain" id="forgot" type="button">找回密码</button></div>
     <div class="field"><input id="secret" name="password" type="password" autocomplete="current-password" required aria-describedby="secret-error"><button class="toggle" id="toggle" type="button" aria-controls="secret">显示密码</button></div>
     <p class="err" id="secret-error"></p><p class="err alert" id="auth-error" role="alert"></p>
     <button class="primary" type="submit">登录</button>
    </form>
    <details class="demo"><summary>用示例数据试用</summary><p>选择一个示例填入表单，再按「登录」。</p><button id="valid" type="button">填入成功示例</button><button id="invalid" type="button">填入失败示例</button></details>
   </section>
   <section id="recovery" hidden aria-labelledby="recover-title">
    <h1 id="recover-title" tabindex="-1">找回密码</h1><p class="hint">用示例邮箱体验重置流程。不会发送邮件。</p>
    <form id="recovery-form" novalidate><div class="field-head"><label for="recover-user">工作邮箱</label></div><input id="recover-user" name="recover-email" type="email" autocomplete="email" placeholder="demo@example.test" required aria-describedby="recovery-error"><p id="recovery-error" class="err"></p><button class="primary" type="submit">模拟发送重置说明</button></form>
    <p id="recovery-status" class="outcome" role="status"></p><button id="back-login" class="plain" type="button">返回登录</button>
   </section>
   <section id="success" hidden aria-labelledby="success-title"><h1 id="success-title" tabindex="-1">模拟登录成功</h1><p class="hint">你已完成演示，未建立真实会话。</p><button id="restart" class="primary" type="button">再试一次</button></section>
   <p class="local">仅使用演示数据。请勿输入真实凭据。</p>
  </div>
 </main>
</div>
<script>
const byId = id => document.getElementById(id);
const user = byId('user'), secret = byId('secret'), recoverUser = byId('recover-user'), toggle = byId('toggle');
function show(id) { for (const name of ['login','recovery','success']) byId(name).hidden = name !== id; byId(id).querySelector('h1').focus(); }
function error(input, text) { byId(input.getAttribute('aria-describedby')).textContent = text; if (text) input.setAttribute('aria-invalid','true'); else input.removeAttribute('aria-invalid'); }
function hideSecret() { secret.type = 'password'; toggle.textContent = '显示密码'; }
function clearLogin() { error(user,''); error(secret,''); byId('auth-error').textContent = ''; }
function fill(value) { clearLogin(); hideSecret(); user.value = 'demo@example.test'; secret.value = value; secret.focus(); }
toggle.onclick = () => { const visible = secret.type === 'password'; secret.type = visible ? 'text' : 'password'; toggle.textContent = visible ? '隐藏密码' : '显示密码'; };
byId('valid').onclick = () => fill('example-only');
byId('invalid').onclick = () => fill('wrong-example');
byId('signin').onsubmit = event => {
 event.preventDefault(); clearLogin(); hideSecret();
 if (!user.validity.valid) error(user,'请输入有效的邮箱地址。');
 if (!secret.value) error(secret,'请输入密码，或使用下方的示例。');
 const bad = event.currentTarget.querySelector('[aria-invalid=true]'); if (bad) { bad.focus(); return; }
 if (user.value === 'demo@example.test' && secret.value === 'example-only') { secret.value = ''; show('success'); return; }
 secret.value = ''; byId('auth-error').textContent = '邮箱或密码不匹配。请重试，或使用找回密码。'; secret.focus();
};
byId('forgot').onclick = () => { recoverUser.value = user.value; secret.value = ''; hideSecret(); error(recoverUser,''); byId('recovery-status').textContent = ''; show('recovery'); };
byId('recovery-form').onsubmit = event => { event.preventDefault(); error(recoverUser,''); if (!recoverUser.validity.valid) { error(recoverUser,'请输入有效的邮箱地址。'); recoverUser.focus(); return; } byId('recovery-status').textContent = '如果该邮箱关联账号，可按邮件说明重置。此演示没有发送邮件。'; };
byId('back-login').onclick = () => { user.value = recoverUser.value; clearLogin(); show('login'); byId('forgot').focus(); };
byId('restart').onclick = () => { user.value = ''; clearLogin(); show('login'); };
</script>
</body>
</html>
